# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  def sale_multiple(kind):
      """Sale day (2025-11-28) vs Mon-Fri 2025-09-01..2025-11-14, all hubs pooled (A-11)."""
      h = R('data/hourly_orders.csv.gz')
      d = pd.to_datetime(h['date'])
      base = h[(d >= '2025-09-01') & (d <= '2025-11-14') & (d.dt.weekday < 5)]
      sale = h[h['date'] == '2025-11-28']
      if kind == 'day':
          return sale['orders'].sum() / base.groupby('date')['orders'].sum().mean()
      return sale.groupby('op_hour')['orders'].sum().max() / base.groupby(['date', 'op_hour'])['orders'].sum().groupby('op_hour').mean().max()
  def ramadan_shift():
      import datetime as _dt
      txt = T('src/peak_capacity/config.py')
      block = txt[txt.index('RAMADAN:'):txt.index('EID_ADHA')]
      starts = [_dt.date(*map(int, m)) for m in _re.findall(r'\d{4}: \(date\((\d+), (\d+), (\d+)\)', block)]
      gaps = [(a.replace(year=b.year) - b).days for a, b in zip(starts, starts[1:])]
      return sum(gaps) / len(gaps)
  def _block(path, name):
      html = T(path)
      m = _re.search(r"const " + name + r" = (.*?); /\* " + name + r":END", html, _re.S)
      return json.loads(m.group(1))
  def series_matches():
      s = _block('demo:compositions/s04-routes.html', 'SERIES')
      if s != J('demo:assets/run_series.json'):
          return False
      hd = R('results/hub_day.csv')
      g = hd.groupby(['config', 'date'])[['on_time', 'accepted']].sum()
      plans = {'rule': 'rule_of_thumb', 'fluid': 'mip_t99_d100', 'derate': 'mip_t99_d85'}
      for r in s['daily']:
          for k, c in plans.items():
              v = g.loc[(c, r['date'])]
              if abs(v['on_time'] / v['accepted'] - r[k]) > 6e-5:
                  return False
      return len(s['daily']) == 51
  def sheet_rows_match():
      sheet = _block('demo:compositions/value.html', 'SHEET')
      src = {h['hub']: h for h in J('demo:assets/sale_day_roster.json')['hubs']}
      keys = ('own_riders', 'gig_total', 'peak_riders', 'max_on_duty', 'busiest_hour', 'busiest_forecast', 'busiest_slots', 'otd')
      for r in sheet['rows']:
          if any(r[k] != src[r['hub']][k] for k in keys):
              return False
      for s in sheet['scene']:
          if s['riders_on_duty'] != src[s['hub']]['riders_on_duty'] or s['forecast'] != src[s['hub']]['forecast']:
              return False
      return [r['hub'] for r in sheet['rows']] == ['A1', 'A2', 'A4', 'B1', 'B2', 'C1'] and [s['hub'] for s in sheet['scene']] == ['A1', 'B2', 'C1']
  def roster_matches_results():
      ex = {h['hub']: h for h in J('demo:assets/sale_day_roster.json')['hubs']}
      hd = R('results/hub_day.csv').query("config=='mip_t99_d85' and date=='2025-11-28'")
      if len(hd) != 12 or set(hd['hub']) != set(ex):
          return False
      pairs = (('own_riders', 'own_riders'), ('gig_blocks', 'gig_total'), ('peak_riders', 'peak_riders'), ('demand', 'demand'),
               ('accepted', 'accepted'), ('on_time', 'on_time'), ('lost', 'lost'), ('rider_cost', 'rider_cost'))
      return all(int(r[a]) == int(ex[r['hub']][b]) for _, r in hd.iterrows() for a, b in pairs)
  def sale_bars_match():
      bars = _block('demo:compositions/s07-end.html', 'SALE')
      d = J('demo:assets/sale_day_roster.json')
      want = [round(sum(h['forecast'][t] for h in d['hubs']), 1) for t in range(len(d['hours']))]
      return bars == want
