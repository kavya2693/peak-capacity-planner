  - {id: F-13, slides: ["04"], label: "Replay with a perfect forecast, riders at 85%", shown: "99.6%", type: direct, source: "results/plan_summary.csv", key: "config=mip_t99_d85_oracle, replay_otd", formula: "x 100, 1 dp",
     check: {expr: "row('results/plan_summary.csv', config='mip_t99_d85_oracle')['replay_otd']*100", fmt: "{:.1f}", expect: "99.6"}}
  - {id: F-14, slides: ["04"], label: "Margin", shown: "WITH A 15% MARGIN", type: derived, source: "src/peak_capacity/experiment.py:64", key: "derate 0.85", formula: "1 - 0.85 = 15%", manual: "Arithmetic on F-11 (checked there)."}
