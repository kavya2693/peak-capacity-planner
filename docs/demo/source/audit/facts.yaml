# Audit facts for the peak-capacity-planner demo video.
# Read by tools/build_audit_report.py (paths relative to this file: repo_dir ../../../.., demo_dir .., out_dir ../..).
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: peak-capacity-planner
  title: "peak-capacity-planner: demo video audit report"
  repo_url: https://github.com/kavya2693/peak-capacity-planner
  repo_dir: ../../../..
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 86.2
  outputs_dir: results
  venv_python: .venv/bin/python
  version_packages: [pulp, sklearn, duckdb, pandas, numpy]
  regenerate:
    - "make run                                   # data/ (seed 11) and results/*.csv, summary.json, run_log.txt (~3 min)"
    - ".venv/bin/python docs/demo/source/tools/export_series.py docs/demo/source/assets/run_series.json"
    - ".venv/bin/python docs/demo/source/tools/export_roster.py docs/demo/source/assets/sale_day_roster.json"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/run_series.json docs/demo/source/compositions/s04-routes.html --marker SERIES"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/sale_day_roster.json docs/demo/source/compositions/value.html --marker SHEET --rows A1,A2,A4,B1,B2,C1 --animate A1,B2,C1"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/sale_day_roster.json docs/demo/source/compositions/s07-end.html --marker SALE"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/peak-capacity-planner-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/peak-capacity-planner-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data_seed: 11, replay_and_model_seed: 0, workers: 4}
  run_time: "results/run_log.txt: 'done' at 179.3 s for make run (4 workers) on the author's laptop"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem (12 hubs, 3 cities, 2023-2025 hourly orders, about 11.2M orders). Production order data is proprietary. Sensitivity: every figure; a new seed moves every number."
    source: "scripts/generate_data.py:14 (seed 11); src/peak_capacity/generate.py:91; README 'The data'"
    all_figures: true
    edit: ["src/peak_capacity/generate.py", "src/peak_capacity/config.py (HUBS)"]
    rerun: ["make data", "make run", "export_series.py + export_roster.py + inject_sheet.py"]
  - id: A-02
    statement: "Rider throughput is derated to 85% of the fluid rate (60 / trip minutes per rider-hour) for the chosen plan. Sensitivity: high; at derate 1.0 replayed on-time falls from 98.9% to 96.4% and rider cost from 8.02M to 7.19M AED."
    source: "src/peak_capacity/experiment.py:64-74 (Config derate 0.85); src/peak_capacity/service.py:19-21 (fluid_rate); plan.py:113 (derate x rate x riders)"
    figures: [F-11, F-12, F-13, F-14, F-29, F-36, F-37, F-38, F-41, F-42, F-43, F-44, F-45, F-46, F-47, F-48, F-50, F-51, F-52, F-53, F-54, F-58, F-59, F-61, F-62, F-72]
    edit: ["src/peak_capacity/experiment.py:64-74"]
    rerun: ["make run", "export_series.py + export_roster.py + inject_sheet.py"]
  - id: A-03
    statement: "Delivered on time = within 60 minutes of the order being placed; an order is ready 6 minutes after it is placed. Sensitivity: high; every on-time share depends on it."
    source: "src/peak_capacity/config.py:17-18 (PROMISE_MINUTES, PICK_MINUTES)"
    figures: [F-06, F-12, F-13, F-36, F-37, F-38, F-39, F-41, F-42, F-44, F-45, F-50, F-54, F-58, F-60, F-72]
    edit: ["src/peak_capacity/config.py:17-18"]
    rerun: ["make run", "export_series.py + export_roster.py + inject_sheet.py"]
  - id: A-04
    statement: "Rider economics in AED: own rider 160 per 8-hour shift, agency rider 130 per 4-hour block, a turned-away order costs 30 in lost margin. Sensitivity: high for every cost figure; none of the on-time shares move unless the plan changes."
    source: "src/peak_capacity/config.py:53-57 (OWN_SHIFT_COST, GIG_BLOCK_COST, LOST_ORDER_COST)"
    figures: [F-47, F-53, F-58, F-59, F-61, F-62]
    edit: ["src/peak_capacity/config.py:53-57"]
    rerun: ["make run", "export_roster.py + inject_sheet.py"]
  - id: A-05
    statement: "Replay randomness: trips are lognormal around each hub's mean with CV 0.35, 25% slower 16:00-19:00 in Ramadan, own riders no-show 3% and agency riders 8%, and 70% of turned-away customers retry the next hour. Sensitivity: medium; changes replayed on-time and turned-away shares."
    source: "src/peak_capacity/config.py:47-48 (TRIP_CV, IFTAR_TRAFFIC), :63-64 (no-shows), :68 (SLOT_RETRY)"
    figures: [F-12, F-13, F-36, F-37, F-38, F-39, F-41, F-42, F-43, F-44, F-45, F-46, F-48, F-50, F-54, F-58, F-60, F-72]
    edit: ["src/peak_capacity/config.py:47-68"]
    rerun: ["make run", "export_series.py + export_roster.py + inject_sheet.py"]
  - id: A-06
    statement: "Hub space caps riders on duty at 3x the riders an ordinary weekday's busiest hour needs; own riders work 6 days in 7, drawn from a city pool. Sensitivity: high on the sale day, where the cap binds (peak on duty = space for every hub on slide 07)."
    source: "src/peak_capacity/config.py:71 (OWN_AVAILABILITY), :75 (SPACE_MULTIPLE); generate.py:142-160 (max_on_duty, own_pool)"
    figures: [F-03, F-04, F-50, F-51, F-52, F-56, F-72]
    edit: ["src/peak_capacity/config.py:71-75"]
    rerun: ["make data", "make run", "export_roster.py + inject_sheet.py"]
  - id: A-07
    statement: "CBC stops at a 0.5% optimality gap or 200 branch-and-bound nodes per city-day, with 20 CPU seconds as a backstop. Sensitivity: low; README reports two full runs differing by under 0.01% of cost in three configurations."
    source: "src/peak_capacity/plan.py:82-83, :127-135; README 'How it works' (stop conditions)"
    figures: [F-22, F-23, F-24, F-50, F-58, F-59, F-61]
    edit: ["src/peak_capacity/plan.py:82-83"]
    rerun: ["make run"]
  - id: A-08
    statement: "Forecasts are made as of a cutoff (31 Jan 2025 for Ramadan, 31 Oct 2025 for the sale) with no data after it; the event model is gradient-boosted (Poisson) on the ratio to each hub's 28-day ordinary level. Sensitivity: medium; forecast quality shows up mainly as turned-away customers."
    source: "src/peak_capacity/config.py:112-115 (WINDOWS); src/peak_capacity/forecast.py:36-37, :71-72"
    figures: [F-19, F-63, F-64, F-67, F-68, F-69, F-70, F-71]
    edit: ["src/peak_capacity/config.py:112-115", "src/peak_capacity/forecast.py"]
    rerun: ["make run"]
  - id: A-09
    statement: "The rule of thumb sizes own riders to the day's forecast at 70% utilisation over three fixed shift starts, adds evening agency blocks, and never closes a slot. Sensitivity: high for every 'vs rule of thumb' figure."
    source: "src/peak_capacity/plan.py:163-204 (rule_of_thumb, utilisation=0.7)"
    figures: [F-09, F-36, F-39, F-58, F-59, F-60, F-61, F-62]
    edit: ["src/peak_capacity/plan.py:170"]
    rerun: ["make run", "export_series.py + inject_sheet.py"]
  - id: A-10
    statement: "Slots are sold up to the roster's flat-out rider throughput (cap rule 'fluid'); the derated-cap rule is kept as an ablation. Sensitivity: high for on time vs turned away (slide 06 phase 2)."
    source: "src/peak_capacity/plan.py:146-147; experiment.py:41, :74"
    figures: [F-41, F-42, F-43, F-44, F-45, F-46, F-47, F-48, F-56]
    edit: ["src/peak_capacity/experiment.py:74"]
    rerun: ["make run", "export_series.py + inject_sheet.py"]
  - id: A-11
    statement: "'Ordinary weekday' for the slide 02 multiples = Monday-Friday in the 10 weeks before the sale ramp (2025-09-01..2025-11-14), all 12 hubs pooled. Sensitivity: low; Oct 1 - Nov 14 gives 4.16x / 3.85x, the same after rounding."
    source: "this audit (definition); data/hourly_orders.csv.gz; README 'The problem' (4.2x, 3.9x)"
    figures: [F-05, F-07]
    edit: ["audit/facts.yaml helpers (sale_multiple)"]
    rerun: ["build_audit_report.py"]
  - id: A-12
    statement: "Video rounding: percentages to 1 decimal, AED millions to 2 decimals, counts with thousands separators; '~11 days', '~3 min' and '11.2M' are rounded labels. Sensitivity: display only."
    source: "this audit (display convention)"
    figures: [F-05, F-07, F-08, F-15, F-25, F-47, F-48, F-54, F-59, F-62, F-73]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-13
    statement: "Slide 01 (industries, everyday problems) is general delivery-operations knowledge used as context, not a result of this repo, and carries no numbers. Sensitivity: none."
    source: "author's framing; README 'The problem' and 'Why it is hard' support problems 1, 3 and 4"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Industries that relate: grocery & quick commerce, food delivery platforms, courier & last-mile fleets", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (peaks move; riders booked from a forecast; busy hours queue up; on time bought by closing slots)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem', 'Why it is hard'", key: "README lines 22-31", formula: "-",
     check: {expr: "grep('README.md', r'The dates move') and grep('README.md', r'Averages lie about queues') and grep('README.md', r'turning customers away') and grep('README.md', r'against a\\s+forecast')", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "06", "08"], label: "Hubs", shown: "12 hubs", type: direct, source: "data/hubs.csv", key: "row count", formula: "-",
     check: {expr: "len(R('data/hubs.csv'))", fmt: "{:d}", expect: "12"}}
  - {id: F-04, slides: ["02", "05"], label: "Cities (each with an own-rider pool)", shown: "3 cities / 3 own-rider pools", type: direct, source: "data/cities.csv", key: "row count", formula: "-",
     check: {expr: "len(R('data/cities.csv'))", fmt: "{:d}", expect: "3"}}
  - {id: F-05, slides: ["02"], label: "Sale-day orders vs an ordinary weekday, network-wide", shown: "Sale day: 4.2× the orders", type: derived, source: "data/hourly_orders.csv.gz", key: "orders on 2025-11-28 / mean Mon-Fri daily orders 2025-09-01..11-14", formula: "49,134 / 11,696 = 4.20", note: "Matches README 'The problem' (4.2 times). Ordinary-weekday window defined in A-11.",
     check: {expr: "sale_multiple('day')", fmt: "{:.1f}", expect: "4.2"}}
  - {id: F-06, slides: ["02", "05"], label: "Delivery promise", shown: "delivered within 60 minutes / promise 60 min", type: direct, source: "src/peak_capacity/config.py:17", key: "PROMISE_MINUTES", formula: "-",
     check: {expr: "grep('src/peak_capacity/config.py', r'^PROMISE_MINUTES = 60\\.0')", fmt: bool}}
  - {id: F-07, slides: ["02"], label: "Sale day's busiest hour vs an ordinary weekday's busiest hour", shown: "busiest hour 3.9× a normal peak", type: derived, source: "data/hourly_orders.csv.gz", key: "max hourly orders 2025-11-28 / max over hours of the mean ordinary-weekday hourly orders", formula: "3.87, rounded", note: "Matches README 'The problem' (3.9 times a normal peak).",
     check: {expr: "sale_multiple('hour')", fmt: "{:.1f}", expect: "3.9"}}
  - {id: F-08, slides: ["02"], label: "Ramadan starts about 11 days earlier each year", shown: "Ramadan moves ~11 days a year", type: derived, source: "src/peak_capacity/config.py:81-86 (RAMADAN)", key: "first-day dates 2023-2026", formula: "mean shift between consecutive years = (12 + 10 + 11) / 3 = 11 days",
     check: {expr: "ramadan_shift()", fmt: "{:.0f}", expect: "11"}}
  # ---- slides 03-04
  - {id: F-09, slides: ["03"], label: "Badges: more on time, lower rider cost, lower total cost (MIP derate 0.85 vs rule of thumb)", shown: "✓ more on time ✓ lower rider cost ✓ lower total cost", type: derived, source: "results/summary.json", key: "replay_otd, rider_cost, total_cost", formula: "mip_t99_d85 better than rule_of_thumb on all three",
     check: {expr: "(lambda s: s['mip_t99_d85']['replay_otd'] > s['rule_of_thumb']['replay_otd'] and s['mip_t99_d85']['rider_cost'] < s['rule_of_thumb']['rider_cost'] and s['mip_t99_d85']['total_cost'] < s['rule_of_thumb']['total_cost'])(J('results/summary.json'))", fmt: bool}}
  - {id: F-10, slides: ["03"], label: "Order history is three years of hourly counts", shown: "3 years, hour by hour", type: direct, source: "data/hourly_orders.csv.gz", key: "date years, op_hour", formula: "distinct years = 2023, 2024, 2025",
