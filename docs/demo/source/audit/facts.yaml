slides:
  - id: "01"
    title: "The industry"
    image: slides/slide-01.jpg
    time: "0.0-7.2 s"
    composition: "compositions/s01-context.html"
    text:
      - "01 · THE INDUSTRY"
      - "Every peak season, someone books the riders weeks ahead."
      - "WHO LIVES WITH THIS · Grocery & quick commerce · Food delivery platforms · Courier & last-mile fleets"
      - "01 The peaks move every year — Festivals and sales land on new dates"
      - "02 Riders are booked from a forecast — Weeks before the real orders arrive"
      - "03 Busy hours queue up even when the numbers add up — Orders wait and the promise slips"
      - "04 \"On time\" can be bought by closing slots — The customer turned away is not counted"
      - "THIS PROJECT tackles all four, end to end · forecast → plan → replay → measure"
    assumptions: [A-13]
    illustrative: ["The whole slide is context; no repo figures."]
    change: "Edit the chips (#ctx-c1..3) and cards (#ctx-k1..4) in compositions/s01-context.html."
  - id: "02"
    title: "This project"
    image: slides/slide-02.jpg
    time: "6.8-11.6 s"
    composition: "compositions/s02-hook.html"
    text:
      - "02 · THIS PROJECT"
      - "12 hubs, 3 cities. Sale day: 4.2× the orders. Riders booked weeks before."
      - "delivered within 60 minutes · busiest hour 3.9× a normal peak · Ramadan moves ~11 days a year"
    assumptions: [A-01, A-03, A-11, A-12]
    illustrative: ["Rings in the background are decoration."]
    change: "Headline spans #hook-l1..l3 and chips #hook-f1..f3 in compositions/s02-hook.html; multiples are recomputed by the sale_multiple helper."
  - id: "03"
    title: "How it works (white chapter, slide A)"
    image: slides/slide-03.jpg
    time: "11.3-19.3 s"
    composition: "compositions/explainer.html (CONFIG.blocks, CONFIG.groups, CONFIG.loop)"
    text:
      - "03 · HOW IT WORKS"
      - "From orders to a roster"
      - "ORDERS 3 years, hour by hour → [WEEKS AHEAD: CLEAN UP fill gaps, drop glitches → FORECAST which night of Ramadan? → PLAN riders + slots each hour] → [THE DAY ITSELF: REPLAY play every single order] → ROSTER OUT ✓ more on time ✓ lower rider cost ✓ lower total cost"
      - "search for the cheapest roster (loop over PLAN)"
    assumptions: [A-02, A-09]
    illustrative: ["Icons and colours are a visual language, not data.", "'THE DAY ITSELF' = the replay plays each planned day against the true orders, after the fact."]
    change: "Edit CONFIG in compositions/explainer.html; badge truth is F-09."
  - id: "04"
    title: "The key idea (white chapter, slide B)"
    image: slides/slide-04.jpg
    time: "19.3-26.3 s"
    composition: "compositions/explainer.html (#ex-b ...)"
    text:
      - "04 · THE KEY IDEA"
      - "Plan for the queue, not the average"
      - "Exactly enough riders still run late — orders bunch up and trips vary, so a queue forms"
      - "So the plan counts each rider at 85% — a margin measured in the replay, not guessed"
      - "And it is judged on everyone who tried to order — closing slots cannot make it look better"
      - "ONE BUSY HOUR AT ONE HUB: SIZED EXACTLY (4 riders) → QUEUE GROWS; WITH A 15% MARGIN (5 riders) → QUEUE CLEARS. Same orders, same hour: the margin keeps it on time."
      - "Replay, perfect forecast: 95.0% on time with riders counted at full speed, 99.6% at 85%."
    assumptions: [A-02, A-03, A-05]
    illustrative: ["The queue demo (4 vs 5 riders, 8 orders) is schematic; it mirrors README 'Where the plan-to-replay gap comes from', not a specific hub-hour."]
    change: "Markup under #ex-b in compositions/explainer.html; the footnote figures are F-12 and F-13."
  - id: "05"
    title: "Architecture"
    image: slides/slide-05.jpg
    time: "26.0-41.0 s"
    composition: "compositions/s03-architecture.html"
    text:
      - "05 · ARCHITECTURE"
      - "Plan each city-day with a MIP; judge it order by order."
      - "Legend: data · forecast · optimizer · evaluation · human step · in-process · file · baseline"
      - "PLAN · WEEKS AHEAD · AS OF THE FORECAST CUTOFF: generate.py · seed 11 → hourly_orders.csv.gz (11.2M orders), hubs.csv (12 hubs · space cap), cities.csv (3 own-rider pools)"
      - "transforms.py DuckDB clean (1,340 gaps filled · 309 spikes fixed) · calendar.py Event features (Ramadan day · Eid · days to the sale)"
      - "forecast.py Event model (HistGB · Poisson · × hourly shape) · seasonal_naive() Last year × growth (baseline)"
      - "decision ? (13 configs) → plan.py · plan_city_day() MIP per city-day (PuLP + CBC · integer riders · 8h shifts · 4h agency blocks · + orders accepted per hour · CBC stop 200 / 200 nodes) | rule_of_thumb() (baseline)"
      - "service.py fluid rate × derate 0.85 ← space · rider pool · trip time"
      - "BUDGETS & FACTS: configurations 13 · city-day plans 1,989 · CBC gap 0.5% · CPU backstop 20 s · full run 179 s · hubs open 07–03 · promise 60 min"
      - "JUDGE · ORDER BY ORDER · ON TRUE DEMAND: true orders (the planner never sees them) → replay.py Order replay (random minutes · FIFO · lognormal trips · no-shows · on time = within 60 min · ✓ tested vs Erlang C) ← roster + slot caps"
      - "7,956 hub-days → experiment.py Summarise (on time: accepted · on time: everyone · turned away · AED) → results/ (plan_summary.csv, tradeoff.csv, hub_day.csv) and → ADR-0001 Pick the derate (from the replay, not assumed) → derate 0.85 (feedback)"
      - "forecast.py Forecast error (forecast vs true · WAPE · bias) → forecast_accuracy.csv"
      - "CRITICAL PATH · orders → clean → forecast → MIP → replay → results"
    assumptions: [A-01, A-02, A-06, A-07, A-08]
    illustrative: ["Packets moving along the wires are decoration in execution order, not measured timings.", "The CBC node counter animates to its real limit (200); the pace is not a measured solve.", "'Pick the derate' is the decision recorded in ADR-0001 (one derate for the run), not an interactive step in the code."]
    change: "Node boxes (#n-*), cylinders (CYL) and the wires object W in compositions/s03-architecture.html."
  - id: "06a"
    title: "The system running: 51 replayed days"
    image: slides/slide-06a.jpg
    time: "40.6-48.2 s"
    composition: "compositions/s04-routes.html (SERIES block from tools/export_series.py)"
    text:
      - "06 · THE SYSTEM RUNNING"
      - "51 peak days, 12 hubs, three plans, replayed order by order."
      - "On time, accepted orders, per day · legend: rule of thumb · MIP, full speed · MIP, riders at 85% · target 99%"
      - "Panels: 24 Feb – 3 Apr 2025 (Ramadan, Eid bands) | 20 Nov – 1 Dec (sale band); y axis 70%–100%"
      - "sale day: rule of thumb 2.2% (arrow: the line leaves the axis)"
      - "ON TIME · ALL 51 DAYS: rule of thumb 76.9% · MIP, full speed 96.4% · MIP, riders at 85% 98.9%"
    assumptions: [A-02, A-05, A-09]
    illustrative: ["Values below 70% are drawn at the axis floor; the arrow and label give the real sale-day value."]
    change: "Regenerate assets/run_series.json with tools/export_series.py and inject it; styling in compositions/s04-routes.html."
  - id: "06b"
    title: "The system running: the metric that disagrees"
    image: slides/slide-06b.jpg
    time: "48.2-55.2 s"
    composition: "compositions/s04-routes.html (#routes-dg)"
    text:
      - "THE METRIC THAT DISAGREES · RIDERS AT 85% · ALL 51 DAYS"
      - "columns: ON TIME · ACCEPTED | ON TIME · EVERYONE | TURNED AWAY"
      - "Sell at full rider speed (the chosen plan): 98.9% · 94.1% · 4.8%"
      - "Sell only at the 85% rate (ablation, kept in results): 99.9% · 90.6% · 9.4%"
      - "Selling fewer slots buys 99.9% on time, but turns away twice the customers and costs +1.03M AED."
