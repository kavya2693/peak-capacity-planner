<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #arch-root { position: absolute; inset: 0; }
        #arch-root .diagram { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 620px; }
        #arch-root svg.wires { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #arch-root .lane {
          position: absolute; border: 2px dashed rgba(132, 148, 166, 0.28); border-radius: 18px; background: rgba(15, 26, 38, 0.35);

          position: absolute; right: 12px; top: -15px; font-family: var(--mono); font-size: 20px; padding: 0 9px;

        }

        #arch-root .L-model { border-color: rgba(185, 162, 255, 0.65); }

        #arch-root .L-opt .f { color: var(--c-opt); }
        #arch-root .L-eval { border-color: rgba(242, 196, 109, 0.65); }
        #arch-root .L-eval .f { color: var(--c-eval); }
        #arch-root .s.ok { color: var(--c-eval); }

        #arch-root .hero .t { font-size: 34px; }
        #arch-root .hero .f { left: 14px; right: auto; }
        #arch-root .hero .s.accent { color: var(--c-opt); }
        #arch-root .budget-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 20px; color: var(--ink-soft); margin-top: 4px; }
        #arch-root .budget-row b { color: var(--c-opt); font-weight: 700; }
        #arch-root .budget { position: relative; width: 100%; height: 10px; border-radius: 5px; background: rgba(63, 216, 168, 0.15); overflow: hidden; }
        #arch-root .budget-fill { position: absolute; left: 0; top: 0; width: 100%; height: 10px; background: var(--c-opt); transform-origin: left center; }
        #arch-root .fallback { border: 2px dashed rgba(132, 148, 166, 0.75); background: rgba(15, 26, 38, 0.6); }
        #arch-root .fallback .t { font-size: 24px; color: var(--ink-soft); }
        #arch-root .fallback .f { color: var(--ink-mute); }
        #arch-root .human { border: 2px solid rgba(238, 242, 246, 0.55); background: #172433; flex-direction: row; align-items: center; gap: 16px; }
        #arch-root .human .f { color: var(--ink); }
        #arch-root .human .col { display: flex; flex-direction: column; gap: 5px; }
        #arch-root .human svg { flex: 0 0 auto; }
        #arch-root .cyl-lab { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
        #arch-root .cyl-lab .n { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--ink); white-space: nowrap; }
        #arch-root .cyl-lab .s { font-family: var(--mono); font-size: 20px; color: var(--ink-soft); white-space: nowrap; }
        #arch-root .group-label { position: absolute; font-family: var(--mono); font-size: 20px; color: var(--c-data); white-space: nowrap; }
        #arch-root .legend {
          position: absolute; right: 120px; top: 186px; display: flex; gap: 20px; align-items: center;
          font-family: var(--mono); font-size: 20px; color: var(--ink-soft); white-space: nowrap;
        }
        #arch-root .legend span { display: flex; align-items: center; gap: 8px; }
        #arch-root .legend i { display: block; width: 14px; height: 14px; border-radius: 4px; }
        #arch-root .legend svg { display: block; }
        #arch-root .crit {
          position: absolute; right: 120px; top: 180px; padding: 4px 16px; border-radius: 8px; opacity: 0;
          border: 2px solid var(--c-opt); background: rgba(8, 121, 93, 0.25);
          font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--ink); white-space: nowrap;
        }
        #arch-root .crit b { color: var(--c-opt); }
        #arch-root .wl { position: absolute; font-family: var(--mono); font-size: 20px; white-space: nowrap; color: var(--ink-soft); }
        #arch-root .card {
          position: absolute; border: 2px solid rgba(132, 148, 166, 0.45); border-radius: 12px; background: rgba(15, 26, 38, 0.85);
          padding: 14px 20px; font-family: var(--mono); font-size: 20px; color: var(--ink-soft);
        }
        #arch-root .card .h { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-mute); margin-bottom: 4px; }
        #arch-root .card .r { display: flex; justify-content: space-between; line-height: 32px; white-space: nowrap; }
        #arch-root .card .r b { color: var(--ink); font-weight: 700; }
        #arch-root .file { position: absolute; font-family: var(--mono); font-size: 20px; color: var(--c-eval); white-space: nowrap; }
      </style>

      <div id="arch-root" data-composition-id="arch" data-width="1920" data-height="1080">
        <div class="scene" id="arch-in">
          <div class="eyebrow" data-layout-allow-overlap id="arch-eyebrow">05 · Architecture</div>
          <div class="scene-title" data-layout-allow-overlap id="arch-title">Plan each city-day with a MIP; judge it order by order.</div>
          <div class="legend" id="arch-legend">
            <span><i style="background: var(--c-data)"></i>data</span>
            <span><i style="background: var(--c-model)"></i>forecast</span>
            <span><i style="background: var(--c-opt)"></i>optimizer</span>
            <span><i style="background: var(--c-eval)"></i>evaluation</span>
            <span><i style="background: #eef2f6"></i>human step</span>
            <span><svg width="38" height="8"><path d="M0 4h38" stroke="#b2bfcc" stroke-width="3"/></svg>in-process</span>
            <span><svg width="38" height="8"><path d="M0 4h38" stroke="#b2bfcc" stroke-width="3" stroke-dasharray="9 6"/></svg>file</span>
            <span><svg width="38" height="8"><path d="M0 4h38" stroke="#8494a6" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/></svg>baseline</span>
          </div>
          <div class="crit" id="arch-crit"><b>CRITICAL PATH</b> · orders → clean → forecast → MIP → replay → results</div>

          <div class="diagram" id="arch-diagram">
            <div class="lane" id="arch-lane1" style="left: 100px; top: 236px; width: 1720px; height: 430px">
              <div class="pill">PLAN · WEEKS AHEAD · AS OF THE FORECAST CUTOFF</div></div>
            <div class="lane" id="arch-lane2" style="left: 100px; top: 722px; width: 1720px; height: 264px">
              <div class="pill" style="left: 330px">JUDGE · ORDER BY ORDER · ON TRUE DEMAND</div></div>

            <svg class="wires" viewBox="0 0 1920 1080" id="arch-svg"></svg>

            <div class="group-label" id="arch-g1" style="left: 124px; top: 256px">generate.py · seed 11</div>
            <div class="wl" id="wl-dec" style="left: 962px; top: 266px; color: var(--c-opt)">13 configs</div>
            <div id="arch-cyl-labels"></div>

            <!-- data / feature layer -->
            <div class="node L-data" id="n-clean" style="left: 410px; top: 280px; width: 250px; height: 130px">
              <div class="f">transforms.py</div><div class="t">DuckDB clean</div><div class="s">1,340 gaps filled</div><div class="s">309 spikes fixed</div></div>
            <div class="node L-data" id="n-cal" style="left: 410px; top: 440px; width: 250px; height: 116px">
              <div class="f">calendar.py</div><div class="t">Event features</div><div class="s">Ramadan day · Eid</div><div class="s">days to the sale</div></div>

            <!-- forecast layer -->
            <div class="node L-model" id="n-model" style="left: 700px; top: 280px; width: 250px; height: 130px">
              <div class="f">forecast.py</div><div class="t">Event model</div><div class="s">HistGB · Poisson</div><div class="s">× hourly shape</div></div>
            <div class="node fallback" id="n-naive" style="left: 700px; top: 440px; width: 250px; height: 80px">
              <div class="f">seasonal_naive()</div><div class="t">Last year × growth</div></div>
            <div class="node fallback" id="n-rule" style="left: 700px; top: 552px; width: 250px; height: 70px">
              <div class="f">rule_of_thumb()</div><div class="t">Rule of thumb</div></div>

            <!-- optimizer -->
            <div class="node L-opt hero" id="n-mip" style="left: 1090px; top: 270px; width: 380px; height: 230px">
              <div class="f">plan.py · plan_city_day()</div>
              <div class="t">MIP per city-day</div>
              <div class="s">PuLP + CBC · integer riders</div>
              <div class="s">8h shifts · 4h agency blocks</div>
              <div class="s accent">+ orders accepted per hour</div>
              <div class="budget-row"><span>CBC stop</span><b id="arch-budget-num">0 / 200 nodes</b></div>
              <div class="budget"><div class="budget-fill" id="arch-budget-fill"></div></div>
            </div>
            <div class="node L-opt" id="n-rate" style="left: 1090px; top: 518px; width: 380px; height: 58px">
              <div class="f">service.py</div><div class="t" style="font-size: 24px">fluid rate × derate 0.85</div></div>

            <div class="card" id="n-nfr" style="left: 1510px; top: 270px; width: 290px; height: 300px">
              <div class="h">BUDGETS &amp; FACTS</div>
              <div class="r" id="nfr-1"><span>configurations</span><b>13</b></div>
              <div class="r" id="nfr-2"><span>city-day plans</span><b>1,989</b></div>
              <div class="r" id="nfr-3"><span>CBC gap</span><b>0.5%</b></div>
              <div class="r" id="nfr-4"><span>CPU backstop</span><b>20 s</b></div>
              <div class="r" id="nfr-5"><span>full run</span><b>179 s</b></div>
              <div class="r" id="nfr-6"><span>hubs open</span><b>07–03</b></div>
              <div class="r" id="nfr-7"><span>promise</span><b>60 min</b></div>
            </div>

            <!-- evaluation lane -->
            <div class="node L-eval" id="n-acc" style="left: 120px; top: 760px; width: 260px; height: 140px">
              <div class="f">forecast.py</div><div class="t">Forecast error</div><div class="s">forecast vs true</div><div class="s">WAPE · bias</div></div>
            <div class="file" id="f-acc" style="left: 120px; top: 916px">→ forecast_accuracy.csv</div>
            <div class="node L-eval" id="n-sum" style="left: 760px; top: 756px; width: 280px; height: 158px; padding-top: 12px">
              <div class="f">experiment.py</div><div class="t">Summarise</div><div class="s">on time: accepted</div><div class="s">on time: everyone</div><div class="s">turned away · AED</div></div>
            <div class="node human" id="n-human" style="left: 1090px; top: 760px; width: 300px; height: 140px">
              <div class="f">ADR-0001</div>
              <svg width="46" height="64" viewBox="0 0 46 64"><circle cx="23" cy="14" r="11" fill="#eef2f6"/><path d="M3 62v-14a20 18 0 0 1 40 0v14z" fill="#eef2f6"/></svg>
              <div class="col"><div class="t" style="font-size: 26px">Pick the derate</div><div class="s">from the replay,</div><div class="s">not assumed</div></div>
            </div>
            <div class="node L-eval" id="n-replay" style="left: 1440px; top: 760px; width: 360px; height: 170px">
              <div class="f">replay.py</div><div class="t">Order replay</div><div class="s">random minutes · FIFO</div><div class="s">lognormal trips · no-shows</div>
              <div class="s">on time = within 60 min</div><div class="s ok">✓ tested vs Erlang C</div></div>

            <!-- wire labels: what flows -->
            <div class="wl" id="wl-truth" style="left: 420px; top: 671px; color: var(--c-data)">true orders · the planner never sees them</div>
            <div class="wl" id="wl-hubs" style="left: 404px; top: 620px; color: var(--c-data)">space · rider pool · trip time</div>
            <div class="wl" id="wl-roster" style="left: 1500px; top: 628px; color: var(--c-opt)">roster + slot caps</div>
            <div class="wl" id="wl-fb" style="left: 1252px; top: 590px; color: #eef2f6">derate 0.85</div>
            <div class="wl" id="wl-hd" style="left: 1110px; top: 920px; color: var(--c-eval)">7,956 hub-days</div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 15.0;
          const NS = "http://www.w3.org/2000/svg";
          const COL = { data: "#7fa8ff", model: "#b9a2ff", opt: "#3fd8a8", eval: "#f2c46d", human: "#eef2f6", mute: "#8494a6" };
          const svg = document.getElementById("arch-svg");
          const el = (tag, at, parent) => {
            const n = document.createElementNS(NS, tag);
            Object.entries(at).forEach(([k, v]) => n.setAttribute(k, v));
            (parent || svg).appendChild(n);
            return n;
          };

          // ---------- data stores (cylinders): every file and count is in data/ or results/
          const CYL = [
            { id: "c-orders", x: 120, y: 290, w: 250, h: 84, lines: ["hourly_orders.csv.gz", "11.2M orders"], c: "data" },
            { id: "c-hubs", x: 120, y: 388, w: 250, h: 84, lines: ["hubs.csv", "12 hubs · space cap"], c: "data" },
            { id: "c-cities", x: 120, y: 486, w: 250, h: 84, lines: ["cities.csv", "3 own-rider pools"], c: "data" },
            { id: "c-res", x: 430, y: 752, w: 280, h: 166, lines: ["results/", "plan_summary.csv", "tradeoff.csv", "hub_day.csv"], c: "eval" },
          ];
          const labHost = document.getElementById("arch-cyl-labels");
          CYL.forEach((c) => {
            const g = el("g", { id: c.id });
            const rx = c.w / 2, ry = 9, x2 = c.x + c.w;
            el("path", { d: `M${c.x} ${c.y + ry} L${c.x} ${c.y + c.h - ry} A${rx} ${ry} 0 0 0 ${x2} ${c.y + c.h - ry} L${x2} ${c.y + ry}`,
              fill: "#0f1a26", stroke: COL[c.c], "stroke-opacity": 0.75, "stroke-width": 2 }, g);
            el("ellipse", { cx: c.x + rx, cy: c.y + ry, rx, ry, fill: "#132131", stroke: COL[c.c], "stroke-opacity": 0.75, "stroke-width": 2 }, g);
            const inner = c.lines.map((t, i) => `<div class="${i === 0 ? "n" : "s"}">${t}</div>`).join("");
            labHost.insertAdjacentHTML("beforeend",
              `<div class="cyl-lab" id="${c.id}-lab" style="left:${c.x}px;top:${c.y + 20}px;width:${c.w}px">${inner}</div>`);
          });

          // ---------- decision point: Config (experiment.py) picks forecaster x method x target x derate
          const DX = 1020, DY = 345, DR = 34;
          const diamond = el("g", { id: "arch-diamond" });
          el("polygon", { points: `${DX},${DY - DR} ${DX + DR},${DY} ${DX},${DY + DR} ${DX - DR},${DY}`, fill: "#0f2629", stroke: COL.opt, "stroke-width": 3 }, diamond);
          const dt = el("text", { x: DX, y: DY + 9, "text-anchor": "middle", "font-family": "JetBrains Mono, monospace", "font-size": 26, "font-weight": 700, fill: "#eef2f6" }, diamond);
          dt.textContent = "?";

          // ---------- wires: points, colour, style (sync | file | fallback | feedback), critical-path flag
          const W = {
            ord: { pts: [[370, 332], [410, 332]], c: "data", s: "sync", crit: true },
            cln: { pts: [[660, 330], [700, 330]], c: "data", s: "sync", crit: true },
            cal: { pts: [[660, 498], [680, 498], [680, 382], [700, 382]], c: "data", s: "sync" },
            fc: { pts: [[950, 345], [986, 345]], c: "model", s: "sync", crit: true },
            nv: { pts: [[950, 480], [1003, 480], [1003, 362]], c: "mute", s: "fallback" },
            mip: { pts: [[1054, 345], [1090, 345]], c: "opt", s: "sync", crit: true },
            rule: { pts: [[1020, 379], [1020, 587], [950, 587]], c: "mute", s: "fallback" },
            hubs: { pts: [[370, 430], [390, 430], [390, 652], [1060, 652], [1060, 547], [1090, 547]], c: "data", s: "file" },
            cty: { pts: [[370, 528], [390, 528]], c: "data", s: "file" },
            rate: { pts: [[1280, 518], [1280, 500]], c: "opt", s: "sync" },
            truth: { pts: [[120, 332], [108, 332], [108, 700], [1650, 700], [1650, 760]], c: "data", s: "file" },
            tacc: { pts: [[250, 700], [250, 760]], c: "data", s: "file" },
            roster: { pts: [[1470, 460], [1490, 460], [1490, 760]], c: "opt", s: "sync", crit: true, hop: true },
            hd: { pts: [[1620, 930], [1620, 958], [900, 958], [900, 914]], c: "eval", s: "file", crit: true },
            res: { pts: [[760, 830], [710, 830]], c: "eval", s: "file", crit: true },
            hum: { pts: [[1040, 830], [1090, 830]], c: "eval", s: "sync" },
            fb: { pts: [[1240, 760], [1240, 576]], c: "human", s: "feedback", hop: true },
          };
          const DASH = { sync: null, file: "12 8", fallback: "2 8", feedback: "10 7" };
          const lenOf = (pts) => pts.slice(1).reduce((t, p, i) => t + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
          const wireLayer = el("g", {});
          svg.insertBefore(wireLayer, svg.firstChild);
          Object.entries(W).forEach(([k, w]) => {
            const d = "M" + w.pts.map((q) => q.join(" ")).join(" L");
            w.len = lenOf(w.pts);
            if (w.hop) el("path", { d, fill: "none", stroke: "#0a1119", "stroke-width": 14 }, wireLayer); // gap where it crosses the truth bus
            // draw-on uses a mask so dashed wires keep their dash pattern while they grow
            const mid = "arch-m-" + k;
            const mask = el("mask", { id: mid, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1920, height: 1080 }, wireLayer);
            const mp = el("path", { d, fill: "none", stroke: "#fff", "stroke-width": 16, "stroke-linecap": "square",
              "stroke-dasharray": w.len + " " + w.len, "stroke-dashoffset": w.len }, mask);
            const p = el("path", { d, id: "arch-w-" + k, fill: "none", stroke: COL[w.c], "stroke-width": 3.5,
              "stroke-linejoin": "round", "stroke-linecap": w.s === "fallback" ? "round" : "butt", opacity: 0.8, mask: `url(#${mid})` }, wireLayer);
            if (DASH[w.s]) p.setAttribute("stroke-dasharray", DASH[w.s]);
            const [a, b] = [w.pts[w.pts.length - 2], w.pts[w.pts.length - 1]];
            const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
            const hx = (r, t) => (b[0] + r * Math.cos(ang + t)).toFixed(1) + " " + (b[1] + r * Math.sin(ang + t)).toFixed(1);
            const head = el("path", { d: `M${hx(12, Math.PI - 0.5)} L${b[0]} ${b[1]} L${hx(12, Math.PI + 0.5)}`, fill: "none", stroke: COL[w.c],
              "stroke-width": 3.5, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 }, wireLayer);
            w.path = p; w.maskPath = mp; w.head = head;
          });
          svg.appendChild(diamond);

          const draw = (k, at) => {
            const w = W[k];
            const dur = Math.max(0.3, w.len / 900);
            tl.fromTo(w.maskPath, { attr: { "stroke-dashoffset": w.len } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: "power2.inOut" }, at);
            tl.fromTo(w.head, { attr: { opacity: 0 } }, { attr: { opacity: 0.9 }, duration: 0.15 }, at + dur - 0.1);
          };
          const pop = (sel, at, from) =>
            tl.fromTo(sel, Object.assign({ opacity: 0, x: 0, y: 0 }, from), { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, at);
          const fade = (sel, at, d) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d || 0.4 }, at);

          // ---------- build, layer by layer
          tl.fromTo("#arch-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#arch-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#arch-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#arch-diagram", { scale: 0.985 }, { scale: 1, duration: D, ease: "sine.out" }, 0);
          fade("#arch-legend", 0.5, 0.5);
          fade("#arch-lane1", 0.6, 0.5);
          // 1 sources
          fade("#arch-g1", 0.8);
          CYL.slice(0, 3).forEach((c, i) => { pop("#" + c.id, 0.9 + i * 0.1, { x: -24 }); pop("#" + c.id + "-lab", 0.9 + i * 0.1, { x: -24 }); });
          // 2 data / feature layer
          draw("ord", 1.4);
          pop("#n-clean", 1.5, { y: 18 });
          pop("#n-cal", 1.65, { y: 18 });
          // 3 forecast layer
          draw("cln", 2.1); draw("cal", 2.15);
          pop("#n-model", 2.3, { y: 18 });
          pop("#n-naive", 2.45, { y: 18 });
          // 4 decision + optimizer
          draw("fc", 2.9); draw("nv", 2.95);
          tl.fromTo("#arch-diamond", { opacity: 0, scale: 0.6, svgOrigin: DX + " " + DY }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 3.0);
          fade("#wl-dec", 3.1);
          draw("mip", 3.35);
          tl.fromTo("#n-mip", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 3.45);
          draw("rule", 3.6);
          pop("#n-rule", 3.8, { x: 16 });
          draw("hubs", 3.9); draw("cty", 3.9); fade("#wl-hubs", 4.2);
          pop("#n-rate", 4.3, { y: 14 });
          draw("rate", 4.5);
          pop("#n-nfr", 4.6, { x: 20 });
          [1, 2, 3, 4, 5, 6, 7].forEach((n, i) => fade("#nfr-" + n, 4.8 + i * 0.08, 0.3));
          // 5 evaluation lane (batch, on the true orders)
          fade("#arch-lane2", 5.4, 0.5);
          draw("truth", 5.5); fade("#wl-truth", 5.9);
          draw("roster", 5.8); fade("#wl-roster", 6.1);
          pop("#n-replay", 6.1, { y: 16 });
          draw("tacc", 6.3);
          pop("#n-acc", 6.4, { y: 16 }); fade("#f-acc", 6.6, 0.3);
          draw("hd", 6.7); fade("#wl-hd", 7.0);
          pop("#n-sum", 6.9, { y: 16 });
          draw("res", 7.2);
          pop("#c-res", 7.3, { x: -16 }); pop("#c-res-lab", 7.3, { x: -16 });
          draw("hum", 7.4);
          pop("#n-human", 7.5, { x: 16 });
          draw("fb", 7.8); fade("#wl-fb", 8.0);

          // CBC node budget: 0 -> 200 nodes while the MIP solves (the node limit is real; the pace is not)
          const budget = { v: 0 };
          const bNum = document.getElementById("arch-budget-num");
          tl.fromTo("#arch-budget-fill", { scaleX: 0 }, { scaleX: 1, duration: 3.0, ease: "power1.inOut" }, 9.0);
          tl.to(budget, { v: 200, duration: 3.0, ease: "power1.inOut", onUpdate: () => { bNum.textContent = Math.round(budget.v) + " / 200 nodes"; } }, 9.0);

          // ---------- data packets, in execution order
          const packet = (k, start, opts) => {
            const w = W[k], o = opts || {};
            const speed = o.speed || 900, travel = Math.max(0.25, w.len / speed);
            const c = el("circle", { r: o.r || 7, cx: w.pts[0][0], cy: w.pts[0][1], fill: COL[w.c], opacity: 0 });
            const kf = [];
            for (let i = 1; i < w.pts.length; i++) {
              const seg = Math.hypot(w.pts[i][0] - w.pts[i - 1][0], w.pts[i][1] - w.pts[i - 1][1]);
              kf.push({ attr: { cx: w.pts[i][0], cy: w.pts[i][1] }, duration: (travel * seg) / w.len, ease: "none" });
            }
            tl.fromTo(c, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.08 }, start);
            tl.to(c, { keyframes: kf }, start);
            tl.to(c, { attr: { opacity: 0 }, duration: 0.1 }, start + travel);
            return start + travel;
          };
          let t = 8.5;
          t = packet("ord", t);
          packet("cal", t);
          t = packet("cln", t);
          packet("nv", t - 0.1, { r: 6 });
          t = packet("fc", t + 0.15);
          packet("hubs", t - 0.2, { speed: 1300 });
          packet("cty", t - 0.2);
          t = packet("mip", t);
          packet("rule", t - 0.1, { r: 6 });
          packet("rate", t + 0.6);
          t = packet("roster", t + 2.2, { speed: 800 });
          packet("truth", t - 1.6, { speed: 1400 });
          packet("tacc", t - 0.5);
          t = packet("hd", t + 0.2, { speed: 1000 });
          packet("res", t);
          t = packet("hum", t + 0.1);
          packet("fb", t + 0.1, { speed: 600 });

          // ---------- critical path, briefly highlighted
          const CP = 13.0;
          const dimSel = ["#c-hubs", "#c-cities", "#c-hubs-lab", "#c-cities-lab", "#n-cal", "#n-naive", "#n-rule", "#n-rate", "#n-nfr",
            "#n-acc", "#f-acc", "#n-human", "#arch-g1", "#arch-in .wl"];
          tl.to(dimSel, { opacity: 0.28, duration: 0.5, ease: "power2.out" }, CP);
          Object.values(W).forEach((w) => {
            if (w.crit) tl.to(w.path, { attr: { "stroke-width": 6, opacity: 1 }, duration: 0.5 }, CP);
            else tl.to([w.path, w.head], { attr: { opacity: 0.18 }, duration: 0.5 }, CP);
          });
          tl.to(["#n-clean", "#n-model", "#n-mip", "#n-replay", "#n-sum"], { boxShadow: "0 0 34px rgba(63,216,168,0.45)", duration: 0.5 }, CP);
          tl.to("#arch-legend", { opacity: 0, duration: 0.3 }, CP);
          tl.fromTo("#arch-crit", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CP + 0.2);

          tl.to("#arch-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["arch"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
